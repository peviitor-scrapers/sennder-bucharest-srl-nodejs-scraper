name: Oportunitati SI Cariere

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          
      - name: Sync with remote
        if: github.event_name != 'pull_request'
        run: git pull origin main --rebase -X theirs

      - name: Install dependencies
        run: npm install

      - name: Pre-scrape — Unit Tests
        run: |
          npm run test:unit
          sed -i 's|<title>Test Report</title>|<title>Pre-scrape: Unit Tests — SENNDER BUCHAREST SRL</title>|;s|<h1 id="title">Test Report</h1>|<h1 id="title">Pre-scrape: Unit Tests — SENNDER BUCHAREST SRL</h1>|' test-report.html
          cp test-report.html docs/test-results/pre-scrape-unit.html || true

      - name: Pre-scrape — Integration Tests
        # Non-blocking: this suite makes live, unmocked calls to demoanaf.ro's
        # search endpoint (searchCompany() in src/anaf.js), which is not part
        # of the production scrape path (only getCompanyFromANAF is used there)
        # but was returning HTTP 402 for days, failing this step and — since
        # no step here had continue-on-error — permanently blocking "Run
        # scraper" below. Test results still get recorded and uploaded either
        # way; a broken third-party demo endpoint should never stop the real
        # scrape from running.
        continue-on-error: true
        run: |
          npm run test:integration
          sed -i 's|<title>Test Report</title>|<title>Pre-scrape: Integration Tests — SENNDER BUCHAREST SRL</title>|;s|<h1 id="title">Test Report</h1>|<h1 id="title">Pre-scrape: Integration Tests — SENNDER BUCHAREST SRL</h1>|' test-report.html
          cp test-report.html docs/test-results/pre-scrape-integration.html || true

      - name: Run scraper
        run: npm run scrape
          
      - name: Check for new jobs
        run: |
          if [ -f tmp/jobs.json ]; then
            echo "New jobs found:"
            cat tmp/jobs.json | jq '.jobs | length'
          else
            echo "No new jobs or scrape failed"
          fi

      - name: Post-scrape — E2E Tests
        # Same live demoanaf.ro/search dependency as the pre-scrape suite
        # (searchCompany() in src/anaf.js) — non-blocking so a broken
        # external demo endpoint can't also skip Consistency Tests below.
        continue-on-error: true
        run: |
          npm run test:e2e
          sed -i 's|<title>Test Report</title>|<title>Post-scrape: E2E Tests — SENNDER BUCHAREST SRL</title>|;s|<h1 id="title">Test Report</h1>|<h1 id="title">Post-scrape: E2E Tests — SENNDER BUCHAREST SRL</h1>|' test-report.html
          cp test-report.html docs/test-results/post-scrape.html || true

      - name: Consistency Tests
        run: |
          npm run test:consistency
          sed -i 's|<title>Test Report</title>|<title>Post-scrape: Consistency Tests — SENNDER BUCHAREST SRL</title>|;s|<h1 id="title">Test Report</h1>|<h1 id="title">Post-scrape: Consistency Tests — SENNDER BUCHAREST SRL</h1>|' test-report.html
          cp test-report.html docs/test-results/post-scrape-consistency.html || true
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: docs/test-results/
          retention-days: 30

      - name: Push test results to docs/
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/test-results/
          git add docs/jobs.md || true
          git commit -m "[skip ci] Update test results" || echo "No changes to commit"
          git push || echo "Push failed (race condition) — will be picked up next run"
          
      - name: Upload jobs JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scraped-jobs
          path: |
            tmp/jobs.json
            tmp/jobs_existing.json
          retention-days: 7